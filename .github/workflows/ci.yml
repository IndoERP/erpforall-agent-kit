name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (tools, installer, packaging)
        run: python3 -I -m unittest discover -s tests
      - name: Validate skills (frontmatter, Sources section, hygiene)
        run: python3 -I scripts/check.py
      - name: Generated packaging is current
        run: python3 -I scripts/build-packaging.py --check
      - name: Installer syntax
        run: bash -n install.sh
